---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Find EXTERNALLY-MANAGED files
      ansible.builtin.find:
        paths: /usr/lib
        patterns: "EXTERNALLY-MANAGED"
        recurse: true
      register: externally_managed_files

    - name: Remove EXTERNALLY-MANAGED files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ externally_managed_files.files }}"

  roles:
    - role: buluma.bootstrap
      # The roles buildtools, python_pip and postgres are required.
      # bareos-dir needs to connect to a database.
    - role: buluma.buildtools
    - role: buluma.postgres
      # The roles core_dependencies and postfix are  required for the `bareos_role`: "dir".
      # bareos-dir needs to send emails.
      # - role: buluma.core_dependencies
      # - role: buluma.postfix
    - role: buluma.bareos_repository
      bareos_repository_enable_tracebacks: true
